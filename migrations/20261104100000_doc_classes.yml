# description: The documentation classes, sections and anonymous read access of exp_doc
- { type: "content_class_group", mode: "ensure", name: "Documentation" }
- type: "content_class"
  mode: "ensure"
  identifier: "exp_doc_page"
  remote_id: "exp-doc-class-exp_doc_page"
  language: "eng-US"
  name: "Doc page"
  description: "A page of the documentation"
  name_pattern: "<short_title|title>"
  container: true
  always_available: true
  sort_field: "priority"
  sort_order: "asc"
  groups:
    - "Documentation"
  attributes:
    - { identifier: "title", type: "ezstring", name: "Title", required: true }
    - { identifier: "short_title", type: "ezstring", name: "Short title" }
    - { identifier: "body", type: "ezxmltext", name: "Body" }
    - { identifier: "original_html", type: "eztext", name: "Original HTML", searchable: false, translatable: false }
    - { identifier: "source_path", type: "ezstring", name: "Source path", searchable: false, translatable: false }
    - { identifier: "source_page_id", type: "ezstring", name: "Source page id", searchable: false, translatable: false }
    - { identifier: "author", type: "ezstring", name: "Author" }
    - { identifier: "source_modified", type: "ezdatetime", name: "Last modified in the source", translatable: false }
    - { identifier: "labels", type: "eztags", name: "Labels" }
    - { identifier: "metadata", type: "xrowmetadata", name: "Metadata", category: "meta" }
    - { identifier: "import_hash", type: "ezstring", name: "Import hash", category: "meta", searchable: false, translatable: false }
